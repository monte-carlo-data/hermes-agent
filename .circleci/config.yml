version: 2.1

orbs:
  docker: circleci/docker@2.2.0
  helm: circleci/helm@3.2.0

defaults:
  - &install_helm_client
    helm/install_helm_client:
      # Stays on 3.x: this is the version that packages and pushes the
      # shipped chart (build-and-push-helm-chart), not just renders it.
      version: 3.19.5

commands:
  verify-version-in-docker-image:
    parameters:
      image:
        description: Image name to validate
        type: string
      version:
        description: Expected contents for /app/hermes/agent/version file
        type: string
    steps:
    - run:
        name: Verify version in Docker image
        command: |
          image_version=$(docker run --rm --entrypoint python << parameters.image >> hermes/agent/settings.py)
          if [ $image_version = "<< parameters.version >>" ]
            then exit 0
            else echo "Failed to find expected version, found: $image_version"; exit 1
          fi
  generate-version-number-dev:
    steps:
    - run:
        command: |
          PIPELINE_NUMBER=<< pipeline.number >>
          if git describe --tags --abbrev=0; then TAG=$(git describe --tags --abbrev=0); else TAG="v0.0.0"; fi
          VERSION=${TAG#v}
          echo "NEXT_VERSION=$(echo "$VERSION" | awk 'BEGIN{FS=OFS="."} {$3+=1} 1')rc${PIPELINE_NUMBER}" >> $BASH_ENV
          source $BASH_ENV
        name: Generate dev version number
  generate-version-number-prod:
    steps:
    - run:
        command: |
          if git describe --tags --abbrev=0; then TAG=$(git describe --tags --abbrev=0); else TAG="v0.0.0"; fi
          echo "VERSION_TAG=${TAG#v}" >> $BASH_ENV
          source $BASH_ENV
        name: Generate prod version number
  install_yq:
    steps:
    - run:
        name: Install yq
        command: |
          VERSION=v4.50.1
          PLATFORM=linux_amd64

          wget https://github.com/mikefarah/yq/releases/download/${VERSION}/yq_${PLATFORM}.tar.gz -O - | tar xz
          sudo mv yq_${PLATFORM} /usr/local/bin/yq
jobs:
  run-linter:
    docker:
      - image: cimg/python:3.13-node
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m venv .venv
            . .venv/bin/activate
            pip install --no-cache-dir --upgrade pip
            pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt
      - run:
          name: 'Run black / pyright'
          command: |
            . .venv/bin/activate
            black --check .
            pyright
      - run:
          name: 'Check NOTICE is up to date'
          command: |
            . .venv/bin/activate
            python scripts/generate_notice.py --check

  run-test-docker:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - docker/build:
          image: mcd/hermes-agent-tests
          extra_build_args: --target tests
          step-name: Run tests in docker build

  render-helm-chart:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - helm/install_helm_client:
          # 4.x for `helm install --dry-run=client`, which render.sh uses to render
          # NOTES.txt: `helm template` excludes it, and 3.19 still reaches for the
          # cluster's version even in client mode, so the notes cases cannot pass
          # on an agent with no kubeconfig.
          version: 4.2.3
      - run:
          name: Render Helm chart test matrix
          command: ./helm/tests/render.sh

  build-and-push:
    machine:
      image: ubuntu-2204:current
    parameters:
      docker_hub_repository:
        type: string
      code_version:
        type: string
    steps:
      - checkout
      - docker/check:
          use-docker-credentials-store: true
      # docker-container driver is required for attestations.
      - run:
          name: Set up buildx (docker-container driver)
          command: |
            docker buildx create --use --name hermes-builder --driver docker-container
            docker buildx inspect --bootstrap
      # Local build first to verify the version before pushing. --load and
      # --push can't coexist with attestations, so the push step is a second
      # build (mostly cached).
      - run:
          name: Build hermes image (local) for version verification
          command: |
            docker buildx build \
              --target hermes-generic \
              --build-arg code_version=<< parameters.code_version >> \
              --build-arg build_number=<< pipeline.number >> \
              --tag montecarlodata/<< parameters.docker_hub_repository >>:latest-generic \
              --load \
              .
      - verify-version-in-docker-image:
          image: montecarlodata/<< parameters.docker_hub_repository >>:latest-generic
          version: << parameters.code_version >>,<< pipeline.number >>
      - run:
          name: Build and push hermes image with SBOM + SLSA provenance attestations
          command: |
            docker buildx build \
              --target hermes-generic \
              --build-arg code_version=<< parameters.code_version >> \
              --build-arg build_number=<< pipeline.number >> \
              --tag montecarlodata/<< parameters.docker_hub_repository >>:latest-generic \
              --tag montecarlodata/<< parameters.docker_hub_repository >>:<< parameters.code_version >>-generic \
              --sbom=true \
              --provenance=mode=max \
              --push \
              .
  build-and-push-helm-chart:
    machine:
      image: ubuntu-2204:current
    parameters:
      docker_hub_repository:
        type: string
      code_version:
        type: string
    steps:
      - *install_helm_client
      - docker/check:
          use-docker-credentials-store: true
      - install_yq
      - run:
          name: Update version and repo
          command: |
            echo repo: << parameters.docker_hub_repository >>
            echo version: << parameters.code_version >>
            # the value for the parameter is the shell expression, like ${VERSION}, we need to evaluate it first
            export VERSION=<< parameters.code_version >>
            # helm requires version to be semantic version compatible, so 0.0.1rc10 needs to be 0.0.1-rc10
            export CHART_VERSION="$(echo $VERSION | sed 's/rc/-rc/')"
            yq eval '.version = strenv(CHART_VERSION)' -i helm/Chart.yaml
            yq eval '.appVersion = strenv(VERSION)' -i helm/Chart.yaml
            yq eval '.name = "<< parameters.docker_hub_repository >>"' -i helm/Chart.yaml
            echo
            echo helm/Chart.yaml:
            cat helm/Chart.yaml
      - run:
          name: Package Helm Chart
          command: |
            helm package helm
      - run:
          name: Push Helm Chart
          command: |
            export CHART_VERSION="$(echo << parameters.code_version >> | sed 's/rc/-rc/')"
            helm push << parameters.docker_hub_repository >>-${CHART_VERSION}.tgz oci://registry-1.docker.io/montecarlodata
  trigger-deploy:
    docker:
      - image: cimg/base:current
    parameters:
      env-type:
        type: enum
        enum: [dev, prod]
      hermes-chart-repo:
        type: string
      hermes-image-repo:
        type: string
    steps:
      - run:
          name: Trigger Hermes agent deployment
          command: |
            # The deployment project and its pipeline definition are supplied by the
            # hermes-agent context, so this repository carries no reference to them.
            : "${DEPLOY_PROJECT_SLUG:?not set - expected from the hermes-agent context}"
            : "${DEPLOY_PIPELINE_DEFINITION_ID:?not set - expected from the hermes-agent context}"
            # Version is set in BASH_ENV by generate-version-number-dev (NEXT_VERSION)
            # or generate-version-number-prod (VERSION_TAG) in pre-steps.
            HERMES_VERSION="${NEXT_VERSION:-${VERSION_TAG}}"
            echo "Triggering deploy for version: ${HERMES_VERSION}"
            if [ "<< parameters.env-type >>" = "dev" ]; then
              DEPLOY_BRANCH="dev"
            else
              DEPLOY_BRANCH="main"
            fi
            echo "Using deploy branch: ${DEPLOY_BRANCH}"
            curl -f -X POST "https://circleci.com/api/v2/project/${DEPLOY_PROJECT_SLUG}/pipeline/run" \
              -H "Circle-Token: ${CIRCLECI_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{
                "definition_id": "'"${DEPLOY_PIPELINE_DEFINITION_ID}"'",
                "config": {
                  "branch": "'"${DEPLOY_BRANCH}"'"
                },
                "checkout": {
                  "branch": "'"${DEPLOY_BRANCH}"'"
                },
                "parameters": {
                  "env-type": "<< parameters.env-type >>",
                  "hermes-version": "'"${HERMES_VERSION}"'",
                  "hermes-chart-repo": "<< parameters.hermes-chart-repo >>",
                  "hermes-image-repo": "<< parameters.hermes-image-repo >>"
                }
              }'
workflows:
  version: 2

  build-and-deploy:
    jobs:
      - run-linter:
          # run for all tags and branches, so the job is available for build-and-push-prod
          filters:
            tags:
              only: /.*/
      - run-test-docker:
          # run for all tags and branches, so the job is available for build-and-push-prod
          filters:
            tags:
              only: /.*/
      - render-helm-chart:
          # run for all tags and branches, so the job is available for build-and-push-prod
          filters:
            tags:
              only: /.*/
      - build-and-push:
          name: build-and-push-dev
          docker_hub_repository: pre-release-agent
          code_version: ${NEXT_VERSION}
          pre-steps:
            - checkout
            - generate-version-number-dev
          context:
            - docker
          requires:
            - run-linter
            - run-test-docker
          filters:
            branches:
              only:
                - dev
      - build-and-push:
          name: build-and-push-prod
          docker_hub_repository: agent
          code_version: ${VERSION_TAG}
          pre-steps:
            - checkout
            - generate-version-number-prod
          context:
            - docker
          requires:
            - run-linter
            - run-test-docker
          filters: # run only for tags starting with v, don't run for branches
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - build-and-push-helm-chart:
          name: build-and-push-helm-chart-dev
          docker_hub_repository: pre-release-generic-agent-helm
          code_version: ${NEXT_VERSION}
          pre-steps:
            - checkout
            - generate-version-number-dev
          context:
            - docker
          requires:
            - build-and-push-dev
            - render-helm-chart
          # Same reason as build-and-push-helm-chart-prod below: a filtered-out
          # `requires` does not keep this off feature branches.
          filters:
            branches:
              only:
                - dev
      - trigger-deploy:
          name: trigger-deploy-dev
          env-type: dev
          hermes-chart-repo: pre-release-generic-agent-helm
          hermes-image-repo: pre-release-agent
          pre-steps:
            - checkout
            - generate-version-number-dev
          context:
            - circleci-secret
            - hermes-agent
          requires:
            - build-and-push-helm-chart-dev
      - build-and-push-helm-chart:
          name: build-and-push-helm-chart-prod
          docker_hub_repository: generic-agent-helm
          code_version: ${VERSION_TAG}
          pre-steps:
            - checkout
            - generate-version-number-prod
          context:
            - docker
          requires:
            - build-and-push-prod
            - render-helm-chart
          # Must repeat build-and-push-prod's filters rather than relying on
          # `requires`: CircleCI drops a filtered-out dependency from the graph
          # and treats the requirement as met, so without `branches: ignore`
          # this ran on every branch. `generate-version-number-prod` resolves
          # ${VERSION_TAG} with `git describe`, which on a branch is the last
          # release tag — so each run republished that released tag from
          # branch content.
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - trigger-deploy:
          name: trigger-deploy-prod
          env-type: prod
          hermes-chart-repo: generic-agent-helm
          hermes-image-repo: agent
          pre-steps:
            - checkout
            - generate-version-number-prod
          context:
            - circleci-secret
            - hermes-agent
          requires:
            - build-and-push-helm-chart-prod
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
