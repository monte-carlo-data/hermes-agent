version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.3.2
  azure-cli: circleci/azure-cli@1.2.2
  docker: circleci/docker@2.2.0
  gcp-cli: circleci/gcp-cli@3.3.2
  helm: circleci/helm@3.2.0

defaults:
  - &install_helm_client
    helm/install_helm_client:
      version: 3.19.5

commands:
  verify-version-in-docker-image:
    parameters:
      image:
        description: Image name to validate
        type: string
      version:
        description: Expected contents for /app/hermes/agent/version file
        type: string
    steps:
    - run:
        name: Verify version in Docker image
        command: |
          image_version=$(docker run --rm --entrypoint python << parameters.image >> hermes/agent/settings.py)
          if [ $image_version = "<< parameters.version >>" ]
            then exit 0
            else echo "Failed to find expected version, found: $image_version"; exit 1
          fi
  generate-version-number-dev:
    steps:
    - run:
        command: |
          PIPELINE_NUMBER=<< pipeline.number >>
          if git describe --tags --abbrev=0; then TAG=$(git describe --tags --abbrev=0); else TAG="v0.0.0"; fi
          VERSION=${TAG#v}
          echo "NEXT_VERSION=$(echo "$VERSION" | awk 'BEGIN{FS=OFS="."} {$3+=1} 1')rc${PIPELINE_NUMBER}" >> $BASH_ENV
          source $BASH_ENV
        name: Generate dev version number
  generate-version-number-prod:
    steps:
    - run:
        command: |
          if git describe --tags --abbrev=0; then TAG=$(git describe --tags --abbrev=0); else TAG="v0.0.0"; fi
          echo "VERSION_TAG=${TAG#v}" >> $BASH_ENV
          source $BASH_ENV
        name: Generate prod version number
  install_yq:
    steps:
    - run:
        name: Install yq
        command: |
          VERSION=v4.50.1
          PLATFORM=linux_amd64

          wget https://github.com/mikefarah/yq/releases/download/${VERSION}/yq_${PLATFORM}.tar.gz -O - | tar xz
          sudo mv yq_${PLATFORM} /usr/local/bin/yq
  update_helm_chart:
    parameters:
      docker_hub_repository_image:
        type: string
      docker_hub_repository_chart:
        type: string
      code_version:
        type: string
      values_file:
        type: string
      cluster_name:
        type: string
    steps:
      - *install_helm_client
      - install_yq
      - run:
          name: Update version in values file
          command: |
            echo repo: << parameters.docker_hub_repository_image >>
            echo version: << parameters.code_version >>
            echo values file: << parameters.values_file >>
            echo
            # the value for the parameter is the shell expression, like ${VERSION}, we need to evaluate it first
            export VERSION=<< parameters.code_version >>
            yq eval '.image.repository = "montecarlodata/<< parameters.docker_hub_repository_image >>"' -i << parameters.values_file >>
            yq eval '.image.tag = (strenv(VERSION) + "-generic")' -i << parameters.values_file >>
            echo
            echo << parameters.values_file >>:
            cat << parameters.values_file >>
      - run:
          name: Upgrade Kubernetes Cluster with Helm
          command: |
            export CHART_VERSION="$(echo << parameters.code_version >> | sed 's/rc/-rc/')"
            helm upgrade --install << parameters.cluster_name >> oci://registry-1.docker.io/montecarlodata/<< parameters.docker_hub_repository_chart >> --version ${CHART_VERSION} -f << parameters.values_file >>
  gcp_cli_setup:
    parameters:
      gcp_creds_config_file:
        type: string
      gcp_project:
        type: string
    steps:
      - gcp-cli/install
      - run:
          name: GCP Auth
          command: |
            if [ -z "$CIRCLE_OIDC_TOKEN" ]; then
              echo "OIDC token not found, ensure this job has a context to populate OIDC token"
              exit 1
            fi
            echo "$CIRCLE_OIDC_TOKEN" > CIRCLE_OIDC_TOKEN_FILE
            gcloud auth login --brief --cred-file=<< parameters.gcp_creds_config_file >>
            echo "export GOOGLE_APPLICATION_CREDENTIALS=<< parameters.gcp_creds_config_file >>" >> $BASH_ENV
            source $BASH_ENV
            gcloud config set project << parameters.gcp_project >>
            gcloud container clusters list
jobs:
  run-linter:
    docker:
      - image: cimg/python:3.12-node
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m venv .venv
            . .venv/bin/activate
            pip install --no-cache-dir --upgrade pip
            pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt
      - run:
          name: 'Run black / pyright'
          command: |
            . .venv/bin/activate
            black --check .
            pyright

  run-test-docker:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - docker/build:
          image: mcd/hermes-agent-tests
          extra_build_args: --target tests
          step-name: Run tests in docker build

  build-and-push:
    machine:
      image: ubuntu-2204:current
    parameters:
      docker_hub_repository:
        type: string
      code_version:
        type: string
    steps:
      - checkout
      - docker/check:
          use-docker-credentials-store: true
      - docker/build:
          step-name: Build hermes image
          use-buildkit: true  # to build only the required stages
          extra_build_args: --target hermes-generic --build-arg code_version=<< parameters.code_version >> --build-arg build_number=<< pipeline.number >>
          image: montecarlodata/<< parameters.docker_hub_repository >>
          tag: latest-generic,<< parameters.code_version >>-generic
      - verify-version-in-docker-image:
          image: montecarlodata/<< parameters.docker_hub_repository >>:latest-generic
          version: << parameters.code_version >>,<< pipeline.number >>
      - docker/push:
          image: montecarlodata/<< parameters.docker_hub_repository >>
          tag: latest-generic,<< parameters.code_version >>-generic
  build-and-push-helm-chart:
    machine:
      image: ubuntu-2204:current
    parameters:
      docker_hub_repository:
        type: string
      code_version:
        type: string
    steps:
      - *install_helm_client
      - docker/check:
          use-docker-credentials-store: true
      - install_yq
      - run:
          name: Update version and repo
          command: |
            echo repo: << parameters.docker_hub_repository >>
            echo version: << parameters.code_version >>
            # the value for the parameter is the shell expression, like ${VERSION}, we need to evaluate it first
            export VERSION=<< parameters.code_version >>
            # helm requires version to be semantic version compatible, so 0.0.1rc10 needs to be 0.0.1-rc10
            export CHART_VERSION="$(echo $VERSION | sed 's/rc/-rc/')"
            yq eval '.version = strenv(CHART_VERSION)' -i helm/Chart.yaml
            yq eval '.appVersion = strenv(VERSION)' -i helm/Chart.yaml
            yq eval '.name = "<< parameters.docker_hub_repository >>"' -i helm/Chart.yaml
            echo
            echo helm/Chart.yaml:
            cat helm/Chart.yaml
      - run:
          name: Package Helm Chart
          command: |
            helm package helm
      - run:
          name: Push Helm Chart
          command: |
            export CHART_VERSION="$(echo << parameters.code_version >> | sed 's/rc/-rc/')"
            helm push << parameters.docker_hub_repository >>-${CHART_VERSION}.tgz oci://registry-1.docker.io/montecarlodata
  update-kubernetes-aws-cluster:
    machine:
      image: ubuntu-2204:current
    parameters:
      docker_hub_repository_chart:
        type: string
      docker_hub_repository_image:
        type: string
      code_version:
        type: string
      cluster_name:
        type: string
      values_file:
        type: string
      aws_region:
        type: string
      aws_role_arn:
        type: string
    steps:
      - aws-cli/setup:
          role_arn: << parameters.aws_role_arn >>
      - run:
          name: Configure EKS Cluster Access
          command: |
            aws eks --region << parameters.aws_region >> update-kubeconfig --name << parameters.cluster_name >>
      - update_helm_chart:
          docker_hub_repository_chart: << parameters.docker_hub_repository_chart >>
          docker_hub_repository_image: << parameters.docker_hub_repository_image >>
          code_version: << parameters.code_version >>
          values_file: << parameters.values_file >>
          cluster_name: << parameters.cluster_name >>
  update-kubernetes-azure-cluster:
    machine:
      image: ubuntu-2204:current
    parameters:
      docker_hub_repository_chart:
        type: string
      docker_hub_repository_image:
        type: string
      code_version:
        type: string
      values_file:
        type: string
      resource_group:
        type: string
      cluster_name:
        type: string
    steps:
      - checkout
      - azure-cli/install
      - run:
          name: Azure login
          command: |
            az login --service-principal --user "${AZURE_CLIENT_ID}" --tenant "${AZURE_TENANT_ID}" --federated-token "${CIRCLE_OIDC_TOKEN}"
      - run: az account show
      - run:
          name: Configure AKS Cluster
          command: |
            az aks get-credentials --resource-group << parameters.resource_group >> --name << parameters.cluster_name >>
      - update_helm_chart:
          docker_hub_repository_chart: << parameters.docker_hub_repository_chart >>
          docker_hub_repository_image: << parameters.docker_hub_repository_image >>
          code_version: << parameters.code_version >>
          values_file: << parameters.values_file >>
          cluster_name: << parameters.cluster_name >>
  update-kubernetes-gcp-cluster:
    machine:
      image: ubuntu-2204:current
    parameters:
      docker_hub_repository_chart:
        type: string
      docker_hub_repository_image:
        type: string
      code_version:
        type: string
      values_file:
        type: string
      cluster_name:
        type: string
      region:
        type: string
      gcp_creds_config_file:
        type: string
      gcp_project:
        type: string
    steps:
      - checkout
      - gcp_cli_setup:
          gcp_creds_config_file: << parameters.gcp_creds_config_file >>
          gcp_project: << parameters.gcp_project >>
      - run:
          name: Configure GKE Cluster
          command: |
            gcloud container clusters get-credentials << parameters.cluster_name >> --region << parameters.region >>
workflows:
  version: 2

  build-and-deploy:
    jobs:
      - run-linter
      - run-test-docker:
          # run for all tags and branches, we need to add this so the job is available for build-and-push-prod
          filters:
            tags:
              only: /.*/
      - build-and-push:
          name: build-and-push-dev
          docker_hub_repository: pre-release-agent
          code_version: ${NEXT_VERSION}
          pre-steps:
            - checkout
            - generate-version-number-dev
          context:
            - docker
          requires:
            - run-linter
            - run-test-docker
          filters:
            branches:
              only:
                - dev
      - build-and-push:
          name: build-and-push-prod
          docker_hub_repository: agent
          code_version: ${VERSION_TAG}
          pre-steps:
            - checkout
            - generate-version-number-prod
          context:
            - docker
          requires:
            - run-linter
            - run-test-docker
          filters: # run only for tags starting with v, don't run for branches
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - build-and-push-helm-chart:
          name: build-and-push-helm-chart-dev
          docker_hub_repository: pre-release-generic-agent-helm
          code_version: ${NEXT_VERSION}
          pre-steps:
            - checkout
            - generate-version-number-dev
          context:
            - docker
          requires:
            - build-and-push-dev
      - update-kubernetes-aws-cluster:
          name: update-kubernetes-aws-cluster-dev
          docker_hub_repository_chart: pre-release-generic-agent-helm
          docker_hub_repository_image: pre-release-agent
          cluster_name: hermes-agent-dev
          values_file: ./environments/dev/values_aws.yaml
          code_version: ${NEXT_VERSION}
          aws_region: us-west-2
          aws_role_arn: arn:aws:iam::REDACTED_AWS_ACCOUNT_ID:role/mc-circleci
          pre-steps:
            - checkout
            - generate-version-number-dev
          context:
            - docker
          requires:
            - build-and-push-helm-chart-dev
      - build-and-push-helm-chart:
          name: build-and-push-helm-chart-prod
          docker_hub_repository: generic-agent-helm
          code_version: ${VERSION_TAG}
          pre-steps:
            - checkout
            - generate-version-number-prod
          context:
            - docker
          requires:
            - build-and-push-prod
      - update-kubernetes-azure-cluster:
          name: update-kubernetes-azure-cluster-dev
          docker_hub_repository_chart: pre-release-generic-agent-helm
          docker_hub_repository_image: pre-release-agent
          values_file: ./environments/dev/values_az.yaml
          code_version: ${NEXT_VERSION}
          resource_group: agent-aks-test
          cluster_name: hermes-agent-dev
          pre-steps:
            - checkout
            - generate-version-number-dev
          context:
            - az-sandbox
          requires:
            - build-and-push-helm-chart-dev
      - update-kubernetes-gcp-cluster:
          name: update-kubernetes-gcp-cluster-dev
          docker_hub_repository_chart: pre-release-generic-agent-helm
          docker_hub_repository_image: pre-release-agent
          cluster_name: mcd-agent-cluster
          region: us-central1
          values_file: ./environments/dev/values_gke.yaml
          gcp_creds_config_file: ./environments/dev/gcp/gcp_creds_config_mc_sandbox.json
          gcp_project: REDACTED_GCP_PROJECT
          code_version: ${NEXT_VERSION}
          pre-steps:
            - checkout
            - generate-version-number-dev
          context:
            - docker
#          requires:
#            - build-and-push-helm-chart-dev
