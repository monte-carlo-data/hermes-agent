# Default values for hermes-agent helm chart.
# Environment-specific values files override these defaults.
# Logs and metrics endpoints default to container.backendServiceUrl + /api/v1/agent/{logs,metrics}

# Whether the chart creates the namespace named by `namespace`. Set to false
# when the namespace is provisioned outside the release (a platform team,
# `kubectl create namespace`, a Terraform `kubernetes_namespace` resource) —
# Helm cannot adopt a namespace it did not create, and the namespace must then
# already exist at install time.
#
# Set this at install time only: flipping it to false on a deployed release
# removes the Namespace from the manifest, and Helm then deletes it. See
# "Namespace Ownership" in helm/README.md.
namespaceCreate: true

replicaCount: 2

image:
  repository: montecarlodata/agent
  pullPolicy: Always
  tag: "latest-generic"

# Pod-level security context. Defaults run the agent as a non-root user
# (UID/GID 1000, baked into the image — see Dockerfile). fsGroup ensures
# emptyDir / projected secret volumes are group-readable by the agent.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Container-level security context applied to the agent container.
# readOnlyRootFilesystem is intentionally off — the agent writes temporary
# files (CA bundles, DB certs, git checkouts) under /tmp at runtime.
# seccompProfile RuntimeDefault is required to satisfy the K8s `restricted`
# Pod Security Standard. Override (e.g. set to {}) on older clusters that
# don't support it.
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

container:
  opsRunnerThreadCount: "18"
  publisherThreadCount: "3"
  # Pod resource requests/limits. Leave empty ({}) to use cluster defaults.
  # Must be set (at least requests) if autoscaling is enabled — HPA uses
  # requests as the utilization baseline.
  resources: {}
    # requests:
    #   cpu: "500m"
    #   memory: "512Mi"
    # limits:
    #   cpu: "2"
    #   memory: "2Gi"
  # Additional environment variables for the agent container, as a native
  # Kubernetes env list (rendered verbatim). Advanced/optional — used to enable
  # optional agent features. Thick mode requires an image that ships the Oracle
  # Instant Client and a dedicated agent (thick is process-wide). Example:
  #   extraEnv:
  #     - name: MCD_ORACLE_THICK_MODE
  #       value: "true"
  extraEnv: []

# Horizontal Pod Autoscaling for the agent deployment.
# Requires container.resources.requests to be set and metrics-server installed
# in the cluster. When enabled, replicaCount is ignored and the HPA manages
# replicas.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  # Optional — leave null to autoscale on CPU only.
  targetMemoryUtilizationPercentage: null

# Log shipping mode — one of:
#   in-process — agent buffers and ships its own logs to /api/v1/agent/logs
#                (works in any cluster, including non-root-only)
#   fluentd    — fluentd DaemonSet tails container logs (requires root pods)
#   none       — disable MC log shipping; rely on your own logging stack
logShipping: in-process

# Tunables for the in-process shipper. Only consulted when
# logShipping == "in-process". DEBUG is rejected by validation — see
# helm/templates/_helpers.tpl.
inProcessLogs:
  logLevel: "INFO"

# OAuth client_credentials authentication. When enabled, the agent
# authenticates to the Monte Carlo backend via Bearer tokens instead of
# the key/token secret. OAuth is selected when `oauthSecret.remoteRef` or
# `oauthSecret.enabled` is set; setting `remoteRef` together with
# `enabled: false` is rejected at template time.
#
# remoteRef: ExternalSecret remote reference for cloud deployments (follows
#   the same pattern as tokenSecret.remoteRef). The ExternalSecret creates
#   a K8s Secret named `mcd-oauth-secret` with a `credentials.json` key
#   containing JSON: {"client_id": "...", "client_secret": "..."}
# enabled: set to true for local/manual deployments (skipExternalSecrets: true)
#   where the K8s Secret `mcd-oauth-secret` is created manually.
# tokenEndpoint: optional override for the OAuth token endpoint URL.
#   Only needed for custom/private Cognito deployments — by default the
#   agent derives the endpoint from container.backendServiceUrl.
#
# ExternalSecret path (cloud secret manager):
# oauthSecret:
#   remoteRef:
#     key: <secret-name>
#
# Manual path (skipExternalSecrets: true, mcd-oauth-secret created by kubectl):
# oauthSecret:
#   enabled: true
#
# Integration credentials synced from your cloud secret manager. Each entry
# becomes a file at /etc/secrets/integrations/<secretKey>. The agent's
# integrations volume is mounted optionally, so this is only needed when you
# have self-hosted credentials — the mcd-integrations-secrets ExternalSecret is
# rendered only when `data` is set.
# integrationsSecrets:
#   data:
#     - secretKey: postgres.json
#       remoteRef:
#         key: mcd/integrations/postgres

logsCollector:
  logLevel: "INFO|WARN|WARNING|ERROR|CRITICAL"
  image:
    # The -forward- variant is the most minimal kubernetes-daemonset image
    # (forward is a core plugin, no extra gems). It includes multi_format
    # parser needed to handle both CRI and Docker JSON log formats.
    # There is no "base" or "http" variant — all images are named by output plugin.
    repository: fluent/fluentd-kubernetes-daemonset
    tag: "v1.18-debian-forward-1"
  buffer:
    flushInterval: "5m"
    retryMaxTimes: 5
    retryWait: "1s"
    chunkLimitSize: "8MB"
    totalLimitSize: "512MB"
    overflowAction: "block"
    retryMaxInterval: "30s"
  # Pod resource requests/limits. Leave empty ({}) to use cluster defaults.
  resources: {}

# Firewall CA for TLS inspection environments.
# Set firewallCa.cert (inline PEM) or firewallCa.externalSecretRef (secret store key name).
firewallCa:
  # Container-level security context for the build-ca-bundle init container.
  # Explicit `runAsUser` is set so admission still passes if a caller's
  # `podSecurityContext` is partially overridden (e.g. operator sets only
  # fsGroup, dropping the pod-level runAsUser default).
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

metricsCollector:
  enabled: true
  collectionIntervalSeconds: 300
  image:
    repository: otel/opentelemetry-collector-k8s
    tag: "0.147.0"
  # Pod resource requests/limits. Leave empty ({}) to use cluster defaults.
  resources: {}
  # Pod-level security context for the metrics-collector daemonset. The OTel
  # k8s image bakes USER 10001:10001 — match it here so the busybox init
  # container inherits the non-root UID, and fsGroup so the shared emptyDir
  # is group-writable by 10001.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  # Container-level security context applied to the OTel main container.
  # seccompProfile RuntimeDefault is required for the K8s `restricted` Pod
  # Security Standard. Adding `readOnlyRootFilesystem: true` here is safe —
  # the OTel collector only needs to write to the projected configmap and
  # emptyDir mounts, which the kubelet permits regardless of root FS mode.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  # Separate security context for the busybox extract-credentials init
  # container. Defaults match `containerSecurityContext` so existing
  # deployments behave identically — the split exists so operators can
  # enable `readOnlyRootFilesystem: true` on the main container without
  # breaking the init's writes to the shared `/shared` emptyDir.
  initContainerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
