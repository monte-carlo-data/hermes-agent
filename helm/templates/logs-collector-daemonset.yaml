{{- include "hermes.logShipping.validate" . }}
{{- if eq .Values.logShipping "fluentd" }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: logs-collector
  namespace: {{ .Values.namespace | default "mcd-agent" | quote }}
  labels:
    app: logs-collector
spec:
  selector:
    matchLabels:
      app: logs-collector
  template:
    metadata:
      labels:
        app: logs-collector
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/logs-collector-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: mcd-agent-service-account
      initContainers:
        {{- if include "hermes.firewallCa.enabled" . }}
        {{- include "hermes.firewallCa.initContainer" . | nindent 8 }}
        {{- end }}
        # Split contents.json into two files so fluentd can read tokens
        # without going through env vars (which leak via /proc/<pid>/environ
        # and bake the substituted command into the pod spec / etcd).
        # Mirrors the pattern used by the metrics-collector daemonset.
        - name: extract-credentials
          image: busybox:1.37
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -c
            - |
              sed -n 's/.*"mcd_id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
                /etc/secrets/mcd-agent-token/contents.json | tr -d '\n' > /shared/mcd_id
              sed -n 's/.*"mcd_token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
                /etc/secrets/mcd-agent-token/contents.json | tr -d '\n' > /shared/mcd_token
          volumeMounts:
            - name: mcd-agent-token-secret
              mountPath: /etc/secrets/mcd-agent-token
              readOnly: true
            - name: shared-credentials
              mountPath: /shared
      containers:
        - name: logs-collector
          image: "{{ .Values.logsCollector.image.repository | default "fluent/fluentd" }}:{{ .Values.logsCollector.image.tag | default "v1.18-1" }}"
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - exec fluentd -c /fluentd/etc/fluent.conf
          {{- if include "hermes.firewallCa.enabled" . }}
          env:
            - name: SSL_CERT_FILE
              value: /etc/ssl/combined-ca/ca-bundle.crt
          {{- end }}
          {{- with .Values.logsCollector.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: logs-collector-config
              mountPath: /fluentd/etc
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            {{- if .Values.logsCollector.containerRuntimeLogPath }}
            - name: containerruntimelogs
              mountPath: {{ .Values.logsCollector.containerRuntimeLogPath }}
              readOnly: true
            {{- end }}
            - name: logs-collector-buffer
              mountPath: /fluentd/buffer
            - name: mcd-agent-token-secret
              mountPath: /etc/secrets/mcd-agent-token
              readOnly: true
            - name: shared-credentials
              mountPath: /shared
              readOnly: true
            {{- if include "hermes.firewallCa.enabled" . }}
            {{- include "hermes.firewallCa.volumeMounts" . | nindent 12 }}
            {{- end }}
      volumes:
        - name: logs-collector-config
          configMap:
            name: logs-collector-config
        - name: varlog
          hostPath:
            path: /var/log
        {{- if .Values.logsCollector.containerRuntimeLogPath }}
        - name: containerruntimelogs
          hostPath:
            path: {{ .Values.logsCollector.containerRuntimeLogPath }}
        {{- end }}
        - name: logs-collector-buffer
          emptyDir: {}
        - name: mcd-agent-token-secret
          secret:
            secretName: mcd-agent-token-secret
        - name: shared-credentials
          emptyDir: {}
        {{- if include "hermes.firewallCa.enabled" . }}
        {{- include "hermes.firewallCa.volumes" . | nindent 8 }}
        {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector: {{ .Values.nodeSelector | toYaml | nindent 8 }}
      {{- else }}
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      {{- end }}
{{- end }}
