{{- include "hermes.logShipping.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcd-agent-deployment
  namespace: {{ .Values.namespace | default "mcd-agent" | quote }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: 
      app: mcd-agent
  template:
    metadata:
      name: mcd-agent
      namespace: {{ .Values.namespace | default "mcd-agent" | quote }}
      labels:
        app: mcd-agent
        {{- if .Values.deploymentTemplateLabels }}
        {{- .Values.deploymentTemplateLabels | toYaml | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: mcd-agent-service-account
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or (include "hermes.firewallCa.enabled" .) .Values.extraInitContainers }}
      initContainers:
        {{- if include "hermes.firewallCa.enabled" . }}
        {{- include "hermes.firewallCa.initContainer" . | nindent 8 }}
        {{- end }}
        {{- if .Values.extraInitContainers }}
        {{- .Values.extraInitContainers | toYaml | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: mcd-generic-agent
          image: "{{ .Values.image.repository | default "montecarlodata/agent" }}:{{ .Values.image.tag | default "latest-generic" }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.container.port | default 8080 }}
          livenessProbe:
            httpGet:
              path: /api/v1/test/healthcheck
              port: {{ .Values.container.port | default 8080 }}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/test/healthcheck
              port: {{ .Values.container.port | default 8080 }}
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- with .Values.container.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PORT
              value: {{ .Values.container.port | default 8080 | quote }}
            - name: BACKEND_SERVICE_URL
              value: {{ .Values.container.backendServiceUrl | quote }}
            - name: MCD_AGENT_WRAPPER_TYPE
              value: KUBERNETES
            - name: MCD_STORAGE_BUCKET_NAME
              value: {{ .Values.container.storageBucketName | quote }}
            - name: MCD_STORAGE
              value: {{ .Values.container.storageType | quote }}
            - name: MCD_OPS_RUNNER_THREAD_COUNT
              value: {{ .Values.container.opsRunnerThreadCount | default "18" | quote }}
            - name: MCD_PUBLISHER_THREAD_COUNT
              value: {{ .Values.container.publisherThreadCount | default "3" | quote }}
            - name: MCD_TOKEN_FILE_PATH
              value: /etc/secrets/mcd-agent-token/contents.json
            - name: MCD_IN_PROCESS_LOGS_ENABLED
              value: {{ eq .Values.logShipping "in-process" | quote }}
            {{- if eq .Values.logShipping "in-process" }}
            - name: MCD_IN_PROCESS_LOGS_LEVEL
              value: {{ .Values.inProcessLogs.logLevel | default "INFO" | quote }}
            {{- end }}
            {{- if .Values.oauth.existingSecret }}
            - name: MCD_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth.existingSecret }}
                  key: client_id
            - name: MCD_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth.existingSecret }}
                  key: client_secret
            {{- if .Values.oauth.tokenEndpoint }}
            - name: MCD_OAUTH_TOKEN_ENDPOINT
              value: {{ .Values.oauth.tokenEndpoint | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.container.storageEndpointUrl }}
            - name: MCD_STORAGE_ENDPOINT_URL
              value: {{ .Values.container.storageEndpointUrl | quote }}
            {{- end }}
            {{- if .Values.container.storageAccessKey }}
            - name: MCD_STORAGE_ACCESS_KEY
              value: {{ .Values.container.storageAccessKey | quote }}
            {{- end }}
            {{- if .Values.container.storageSecretKey }}
            - name: MCD_STORAGE_SECRET_KEY
              value: {{ .Values.container.storageSecretKey | quote }}
            {{- end }}
            {{- if .Values.container.storageAccountName }}
            - name: MCD_STORAGE_ACCOUNT_NAME
              value: {{ .Values.container.storageAccountName | quote }}
            {{- end }}
            {{- if include "hermes.firewallCa.enabled" . }}
            - name: REQUESTS_CA_BUNDLE
              value: /etc/ssl/combined-ca/ca-bundle.crt
            {{- end }}
            {{- if .Values.container.extraEnv }}
            {{- .Values.container.extraEnv | toYaml | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: mcd-agent-token-secret
              mountPath: /etc/secrets/mcd-agent-token
              readOnly: true
            - name: mcd-integrations-secrets
              mountPath: /etc/secrets/integrations
              readOnly: true
            {{- if include "hermes.firewallCa.enabled" . }}
            {{- include "hermes.firewallCa.volumeMounts" . | nindent 12 }}
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- .Values.extraVolumeMounts | toYaml | nindent 12 }}
            {{- end }}
      volumes:
        - name: mcd-agent-token-secret
          secret:
            secretName: mcd-agent-token-secret
        - name: mcd-integrations-secrets
          secret:
            secretName: mcd-integrations-secrets
        {{- if include "hermes.firewallCa.enabled" . }}
        {{- include "hermes.firewallCa.volumes" . | nindent 8 }}
        {{- end }}
        {{- if .Values.extraVolumes }}
        {{- .Values.extraVolumes | toYaml | nindent 8 }}
        {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector: {{ .Values.nodeSelector | toYaml | nindent 8 }}
      {{- else }}
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      {{- end }}
