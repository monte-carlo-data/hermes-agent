apiVersion: apps/v1
kind: Deployment  
metadata:
  name: mcd-agent-deployment
  namespace: {{ .Values.namespace | default "mcd-agent" | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: 
      app: mcd-agent
  template:
    metadata:
      name: mcd-agent
      namespace: {{ .Values.namespace | default "mcd-agent" | quote }}
      labels:
        app: mcd-agent
        {{- if .Values.deploymentTemplateLabels }}
        {{- .Values.deploymentTemplateLabels | toYaml | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: mcd-agent-service-account
      {{- if or .Values.firewallCa.cert .Values.firewallCa.keyVaultSecretRef .Values.extraInitContainers }}
      initContainers:
        {{- if or .Values.firewallCa.cert .Values.firewallCa.keyVaultSecretRef }}
        - name: build-ca-bundle
          image: "{{ .Values.image.repository | default "montecarlodata/agent" }}:{{ .Values.image.tag | default "latest-generic" }}"
          command:
            - sh
            - -c
            - cat /etc/ssl/certs/ca-certificates.crt /etc/ssl/firewall-ca/ca.crt > /etc/ssl/combined-ca/ca-bundle.crt
          volumeMounts:
            - name: firewall-ca
              mountPath: /etc/ssl/firewall-ca
              readOnly: true
            - name: combined-ca
              mountPath: /etc/ssl/combined-ca
        {{- end }}
        {{- if .Values.extraInitContainers }}
        {{- .Values.extraInitContainers | toYaml | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: mcd-generic-agent
          image: "{{ .Values.image.repository | default "montecarlodata/agent" }}:{{ .Values.image.tag | default "latest-generic" }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: 
            - containerPort: {{ .Values.container.port }}
          env:
            - name: PORT
              value: {{ .Values.container.port | quote }}
            - name: BACKEND_SERVICE_URL
              value: {{ .Values.container.backendServiceUrl | quote }}
            - name: GUNICORN_WORKERS
              value: {{ .Values.container.gunicornWorkers | quote }}
            - name: GUNICORN_THREADS
              value: {{ .Values.container.gunicornThreads | quote }}
            - name: MCD_AGENT_WRAPPER_TYPE
              value: KUBERNETES
            - name: MCD_STORAGE_BUCKET_NAME
              value: {{ .Values.container.storageBucketName | quote }}
            - name: MCD_STORAGE
              value: {{ .Values.container.storageType | quote }}
            - name: MCD_OPS_RUNNER_THREAD_COUNT
              value: {{ .Values.container.opsRunnerThreadCount | default "5" | int | quote}}
            - name: MCD_PUBLISHER_THREAD_COUNT
              value: {{ .Values.container.publisherThreadCount | default "2" | int | quote }}
            - name: MCD_TOKEN_FILE_PATH
              value: /etc/secrets/mcd-agent-token/contents.json
            {{- if .Values.container.storageEndpointUrl }}
            - name: MCD_STORAGE_ENDPOINT_URL
              value: {{ .Values.container.storageEndpointUrl | quote }}
            {{- end }}
            {{- if .Values.container.storageAccessKey }}
            - name: MCD_STORAGE_ACCESS_KEY
              value: {{ .Values.container.storageAccessKey | quote }}
            {{- end }}
            {{- if .Values.container.storageSecretKey }}
            - name: MCD_STORAGE_SECRET_KEY
              value: {{ .Values.container.storageSecretKey | quote }}
            {{- end }}
            {{- if .Values.container.storageAccountName }}
            - name: MCD_STORAGE_ACCOUNT_NAME
              value: {{ .Values.container.storageAccountName | quote }}
            {{- end }}
            {{- if .Values.container.extraEnv }}
            {{- .Values.container.extraEnv | toYaml | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: mcd-agent-token-secret
              mountPath: /etc/secrets/mcd-agent-token
              readOnly: true
            - name: mcd-integrations-secrets
              mountPath: /etc/secrets/integrations
              readOnly: true
            {{- if or .Values.firewallCa.cert .Values.firewallCa.keyVaultSecretRef }}
            - name: firewall-ca
              mountPath: /etc/ssl/firewall-ca
              readOnly: true
            - name: combined-ca
              mountPath: /etc/ssl/combined-ca
              readOnly: true
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- .Values.extraVolumeMounts | toYaml | nindent 12 }}
            {{- end }}
      volumes:
        - name: mcd-agent-token-secret
          secret:
            secretName: mcd-agent-token-secret
        - name: mcd-integrations-secrets
          secret:
            secretName: mcd-integrations-secrets
        {{- if or .Values.firewallCa.cert .Values.firewallCa.keyVaultSecretRef }}
        - name: firewall-ca
          {{- if .Values.firewallCa.cert }}
          configMap:
            name: firewall-ca-cert
          {{- else }}
          secret:
            secretName: firewall-ca-cert
          {{- end }}
        - name: combined-ca
          emptyDir: {}
        {{- end }}
        {{- if .Values.extraVolumes }}
        {{- .Values.extraVolumes | toYaml | nindent 8 }}
        {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector: {{ .Values.nodeSelector | toYaml | nindent 8 }}
      {{- else }}
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      {{- end }}
