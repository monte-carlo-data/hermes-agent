apiVersion: apps/v1
kind: Deployment  
metadata:
  name: mcd-agent-deployment
  namespace: {{ .Values.namespace | default "mcd-agent" | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: 
      app: mcd-agent
  template:
    metadata:
      name: mcd-agent
      namespace: {{ .Values.namespace | default "mcd-agent" | quote }}
      labels:
        app: mcd-agent
        {{- if .Values.deploymentTemplateLabels }}
        {{- .Values.deploymentTemplateLabels | toYaml | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: mcd-agent-service-account
      containers:
        - name: mcd-generic-agent
          image: "{{ .Values.image.repository | default "montecarlodata/agent" }}:{{ .Values.image.tag | default "latest-generic" }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.container.port | default 8080 }}
          livenessProbe:
            httpGet:
              path: /api/v1/test/healthcheck
              port: {{ .Values.container.port | default 8080 }}
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/test/healthcheck
              port: {{ .Values.container.port | default 8080 }}
            initialDelaySeconds: 10
            periodSeconds: 10
          env:
            - name: PORT
              value: {{ .Values.container.port | default 8080 | quote }}
            - name: BACKEND_SERVICE_URL
              value: {{ .Values.container.backendServiceUrl | quote }}
            - name: MCD_AGENT_WRAPPER_TYPE
              value: KUBERNETES
            - name: MCD_STORAGE_BUCKET_NAME
              value: {{ .Values.container.storageBucketName | quote }}
            - name: MCD_STORAGE
              value: {{ .Values.container.storageType | quote }}
            - name: MCD_OPS_RUNNER_THREAD_COUNT
              value: {{ .Values.container.opsRunnerThreadCount | quote }}
            - name: MCD_PUBLISHER_THREAD_COUNT
              value: {{ .Values.container.publisherThreadCount | quote }}
            - name: MCD_TOKEN_FILE_PATH
              value: /etc/secrets/mcd-agent-token/contents.json
            {{- if .Values.container.storageEndpointUrl }}
            - name: MCD_STORAGE_ENDPOINT_URL
              value: {{ .Values.container.storageEndpointUrl | quote }}
            {{- end }}
            {{- if .Values.container.storageAccessKey }}
            - name: MCD_STORAGE_ACCESS_KEY
              value: {{ .Values.container.storageAccessKey | quote }}
            {{- end }}
            {{- if .Values.container.storageSecretKey }}
            - name: MCD_STORAGE_SECRET_KEY
              value: {{ .Values.container.storageSecretKey | quote }}
            {{- end }}
            {{- if .Values.container.storageAccountName }}
            - name: MCD_STORAGE_ACCOUNT_NAME
              value: {{ .Values.container.storageAccountName | quote }}
            {{- end }}
          volumeMounts:
            - name: mcd-agent-token-secret
              mountPath: /etc/secrets/mcd-agent-token
              readOnly: true
            - name: mcd-integrations-secrets
              mountPath: /etc/secrets/integrations
              readOnly: true
      volumes:
        - name: mcd-agent-token-secret
          secret:
            secretName: mcd-agent-token-secret
        - name: mcd-integrations-secrets
          secret:
            secretName: mcd-integrations-secrets
      {{- if .Values.nodeSelector }}
      nodeSelector: {{ .Values.nodeSelector | toYaml | nindent 8 }}
      {{- else }}
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      {{- end }}
