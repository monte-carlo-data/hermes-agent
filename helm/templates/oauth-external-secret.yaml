{{/* Gated on the selected method, not just on remoteRef: otherwise a release
     using key/token auth still syncs OAuth client credentials into a Secret
     that nothing mounts, and keeps re-reading them every refreshInterval. */}}
{{- if and (not .Values.skipExternalSecrets) (include "hermes.oauth.enabled" .) ((.Values.oauthSecret).remoteRef) }}
kind: ExternalSecret
apiVersion: external-secrets.io/v1
metadata:
  name: mcd-oauth-secret
  namespace: {{ .Values.namespace | default "mcd-agent" | quote }}
spec:
  data:
    - secretKey: credentials.json
      remoteRef: {{ .Values.oauthSecret.remoteRef | toYaml | nindent 8 }}
  secretStoreRef:
    kind: SecretStore
    name: mcd-agent-secret-store
  target:
    name: mcd-oauth-secret
    creationPolicy: {{ (.Values.oauthSecret).targetCreationPolicy | default "Owner" | quote }}
  refreshInterval: {{ (.Values.oauthSecret).refreshInterval | default "1h" | quote }}
{{- end }}
