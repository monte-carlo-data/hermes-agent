{{- if .Values.metricsCollector.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcd-agent-metrics-reader
rules:
  - apiGroups: [""]
    resources: ["nodes/metrics", "nodes/proxy", "nodes/stats", "nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcd-agent-metrics-reader
subjects:
  - kind: ServiceAccount
    name: mcd-agent-service-account
    namespace: {{ .Values.namespace | default "mcd-agent" | quote }}
roleRef:
  kind: ClusterRole
  name: mcd-agent-metrics-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
