{{/*
Only rendered when integration credentials are actually configured. The agent's
integrations volume is optional, so a deployment without self-hosted
credentials needs no secret at all — previously this template synthesised one
by pointing a dummy `empty.json` key at the token/oauth remoteRef purely to
satisfy ESO's "data is required" validation.
*/}}
{{- if and (not .Values.skipExternalSecrets) ((.Values.integrationsSecrets).data) }}
kind: ExternalSecret
apiVersion: external-secrets.io/v1
metadata:
  name: mcd-integrations-secrets
  namespace: {{ .Values.namespace | default "mcd-agent" | quote }}
spec:
  data:
    {{- range .Values.integrationsSecrets.data }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef: {{ .remoteRef | toYaml | nindent 8 }}
    {{- end }}
  secretStoreRef:
    kind: SecretStore
    name: mcd-agent-secret-store
  target:
    name: mcd-integrations-secrets
    creationPolicy: {{ .Values.integrationsSecrets.targetCreationPolicy | default "Owner" | quote }}
  refreshInterval: {{ .Values.integrationsSecrets.refreshInterval | default "1h" | quote }}
{{- end }}
