{{- if eq .Values.logShipping "daemonset" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: logs-collector-config
  namespace: {{ .Values.namespace | default "mcd-agent" | quote }}
data:
  fluent.conf: |
    # Prevent Fluentd from dumping the full config (which includes secrets) at startup
    <system>
      suppress_config_dump true
    </system>

    <source>
      @type tail
      path /var/log/containers/mcd-agent-deployment-*_{{ .Values.namespace | default "mcd-agent" }}_*.log
      pos_file /fluentd/buffer/fluentd-containers.log.pos
      tag kubernetes.*
      read_from_head true
      follow_inodes true
      # Container runtimes use different log formats. multi_format tries
      # each pattern in order until one matches:
      #   - json: Docker / k3s containerd ({"log":"...","stream":"...","time":"..."})
      #   - regexp: CRI format used by EKS containerd (<time> <stream> <flags> <message>)
      <parse>
        @type multi_format
        <pattern>
          format json
          time_key time
          time_format %Y-%m-%dT%H:%M:%S.%N%z
        </pattern>
        <pattern>
          format regexp
          expression /^(?<time>[^ ]+) (?<stream>stdout|stderr) [^ ]+ (?<log>.*)$/
          time_key time
          time_format %Y-%m-%dT%H:%M:%S.%N%z
        </pattern>
      </parse>
    </source>

    # Parse agent's JSON log output from record["log"] into individual fields.
    # After this step, record has: ts, level, logger, msg, instance_id, etc.
    <filter kubernetes.**>
      @type parser
      key_name log
      reserve_data false
      <parse>
        @type json
      </parse>
    </filter>

    {{- if .Values.logsCollector.logLevel | default "WARN|WARNING|ERROR|CRITICAL" }}
    # Drop log lines that don't match the configured log level filter.
    # Uses the parsed "level" field from the agent's JSON output.
    <filter kubernetes.**>
      @type grep
      <regexp>
        key level
        pattern /{{ .Values.logsCollector.logLevel | default "WARN|WARNING|ERROR|CRITICAL" }}/i
      </regexp>
    </filter>
    {{- end }}

    # Reshape record to match the orchestrator's logs API format.
    # Maps agent JSON fields to {timestamp, message, ...} and passes
    # instance_id through for Datadog tagging.
    <filter kubernetes.**>
      @type record_transformer
      enable_ruby true
      renew_record true
      <record>
        timestamp ${record["ts"] || time.strftime('%Y-%m-%dT%H:%M:%S.%6N%z')}
        message ${record["msg"] || record["log"] || ""}
        instance_id ${record["instance_id"] || ""}
      </record>
    </filter>

    <match kubernetes.**>
      @type http
      endpoint {{ .Values.logsCollector.endpoint | default (printf "%s/api/v1/agent/logs" .Values.container.backendServiceUrl) }}
      http_method post
      content_type application/json

      headers {
        "x-mcd-id"    : "#{ENV['MCD_ID']}",
        "x-mcd-token" : "#{ENV['MCD_TOKEN']}"
      }

      retryable_response_codes [503]
      json_array true
      <format>
        @type json
      </format>
      <buffer>
        @type file
        path /fluentd/buffer/buffer
        flush_interval {{ .Values.logsCollector.buffer.flushInterval | default "5m" }}
        retry_max_times {{ .Values.logsCollector.buffer.retryMaxTimes | default 5 }}
        retry_wait {{ .Values.logsCollector.buffer.retryWait | default "1s" }}
        chunk_limit_size {{ .Values.logsCollector.buffer.chunkLimitSize | default "8MB" }}
        total_limit_size {{ .Values.logsCollector.buffer.totalLimitSize | default "512MB" }}
        overflow_action {{ .Values.logsCollector.buffer.overflowAction | default "block" }}
        retry_type exponential_backoff
        retry_max_interval {{ .Values.logsCollector.buffer.retryMaxInterval | default "30s" }}
      </buffer>
    </match>
{{- end }}
