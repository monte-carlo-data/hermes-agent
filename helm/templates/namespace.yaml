{{/* `| default true` would be wrong here: Go templates treat false as empty,
     so an explicit `namespaceCreate: false` would fall back to the default. */}}
{{- if or (not (hasKey .Values "namespaceCreate")) .Values.namespaceCreate }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace | default "mcd-agent" | quote }}
{{- end }}
