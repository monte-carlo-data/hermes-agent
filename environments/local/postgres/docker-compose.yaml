services:
  postgres:
    image: postgres:16
    container_name: hermes-postgres
    environment:
      POSTGRES_USER: mcd
      POSTGRES_PASSWORD: mcd
      POSTGRES_DB: mcd
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcd -d mcd"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
